name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: ./build.sh
      - name: Zip app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent build/T3CodeKitty.app "T3CodeKitty-${VERSION}.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "T3 Code Kitty $GITHUB_REF_NAME" \
            --generate-notes \
            T3CodeKitty-*.zip
